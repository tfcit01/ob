<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star 700II 視覺化模擬器 (單步強化版)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0056b3;
            --accent-color: #ff4500;
            --paper-color: #e6eef5; /* 淺青灰色，非純白 (修正1) */
            --bg-color: #f4f4f9;
            --panel-bg: #ffffff;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        body { font-family: var(--font-main); margin: 0; padding: 0; background-color: var(--bg-color); height: 100vh; display: flex; flex-direction: column; }
        header { background: #2c3e50; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        h1 { margin: 0; font-size: 1.4rem; }
        
        #app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        #visualization-area { flex: 3; position: relative; background: #e0e5ec; display: flex; justify-content: center; align-items: center; }
        .highlight-zone { position: absolute; top: 5%; right: 5%; width: 55%; height: 65%; background: rgba(255, 255, 0, 0.08); border: 2px dashed rgba(255, 215, 0, 0.4); border-radius: 10px; pointer-events: none; }

        svg { width: 95%; height: 95%; max-width: 1200px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #control-panel { flex: 1; min-width: 320px; background: var(--panel-bg); padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; box-shadow: -2px 0 10px rgba(0,0,0,0.05); }
        
        .status-display { background: #f8f9fa; padding: 12px; border-radius: 6px; font-family: monospace; border: 1px solid #e9ecef; color: var(--primary-color); font-weight: bold; }
        button { background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        button:hover:not(:disabled) { background: #004494; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }

        label { display: flex; align-items: center; font-size: 0.9rem; cursor: pointer; margin-top: 5px; }
        input[type="range"] { width: 100%; margin: 10px 0; }
        
        .dust-particle { fill: #e63946; opacity: 0; } /* 鮮明深紅色 (修正2) */
        .transparent-casing { opacity: 0.1 !important; stroke-dasharray: 5,5; }
    </style>
</head>
<body>
    <header>
        <div><h1>TSP700II 機構模擬器</h1><span style="opacity:0.7">紙屑噴濺與單步操作校正版</span></div>
    </header>

    <div id="app-container">
        <main id="visualization-area">
            <div class="highlight-zone"></div>
            <svg viewBox="0 0 800 600" id="printer-svg">
                <g id="paper-module" transform="translate(180, 400)">
                    <g id="paper-roll-full-group">
                        <circle cx="0" cy="0" r="100" fill="#d1d9e0" stroke="#aaa" />
                        <line x1="0" y1="-100" x2="0" y2="100" stroke="#fff" opacity="0.5" />
                        <line x1="-100" y1="0" x2="100" y2="0" stroke="#fff" opacity="0.5" />
                    </g>
                    <text x="0" y="130" text-anchor="middle" fill="#666">紙卷</text>
                </g>

                <path id="paper-path-main" d="M180,300 Q180,180 400,180 L595,180" fill="none" stroke="var(--paper-color)" stroke-width="14" stroke-linecap="round" />

                <g transform="translate(550, 180) scale(1.8)">
                    <g id="platen-roller-group" transform="translate(0, -20)">
                        <circle r="22" fill="#222" />
                        <line x1="0" y1="-22" x2="0" y2="-10" stroke="#666" stroke-width="3" id="roller-marker" />
                    </g>
                    <rect id="thermal-head" x="-20" y="20" width="40" height="10" fill="#555" rx="2" />
                    
                    <line id="paper-receipt-printed" x1="25" y1="0" x2="25" y2="0" stroke="var(--paper-color)" stroke-width="7.8" />

                    <g id="cutter-mechanism" transform="translate(50, 0)">
                        <text y="-55" text-anchor="middle" font-size="9" font-weight="bold">裁刀</text>
                        <path d="M-12,10 L12,10 L8,20 L-8,20 Z" fill="#777" />
                        <g id="cutter-blade-moving-group" transform="translate(0, -45)">
                            <path d="M-14,-10 L14,-10 L12,5 L0,22 L-12,5 Z" fill="#999" stroke="#333" />
                        </g>
                    </g>

                    <g id="chads-particles" transform="translate(50, 0)">
                        <circle class="dust-particle" cx="0" cy="0" r="1.8" />
                        <circle class="dust-particle" cx="1" cy="1" r="2.0" />
                        <circle class="dust-particle" cx="-1" cy="-1" r="1.6" />
                        <circle class="dust-particle" cx="2" cy="-2" r="1.9" />
                        <circle class="dust-particle" cx="-2" cy="2" r="2.1" />
                        <circle class="dust-particle" cx="0" cy="3" r="1.7" />
                    </g>
                </g>

                <path id="chassis-outline" d="M50,550 L50,100 Q50,20 150,20 L750,20 L750,550 Z" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="5,5" />
            </svg>
        </main>

        <aside id="control-panel">
            <div class="status-display" id="status-text">Ready</div>
            <div id="step-info" style="font-size:0.8rem; color:#888;">Step: 0/3</div>
            
            <button id="btn-auto">▶ 自動執行全流程</button>
            <button id="btn-next" class="btn-secondary">⏯ 下一步 (單步執行)</button>
            <button id="btn-reset" class="btn-secondary">↺ 重置</button>

            <hr style="width:100%; opacity:0.2">
            
            <label><input type="checkbox" id="chk-xray" checked> 透視模式</label>
            <label>動畫速度: <span id="speed-txt">1.0</span>x</label>
            <input type="range" id="rng-speed" min="0.1" max="3" step="0.1" value="1">

            <div style="font-size: 0.8rem; color: #666; background: #fffbe6; padding: 10px; border: 1px solid #ffe58f; border-radius: 4px;">
                <strong>物理觀察重點：</strong><br>
                注意裁刀落下時，紅色紙屑不僅向右噴出，也會有部分碎屑<strong>向左噴往滾輪方向</strong>。這正是造成 TSP700II 內部積塵的原因。
            </div>
        </aside>
    </div>

    <script>
        const config = { maxPaper: 70, travel: 45 };
        const state = { step: 0, animating: false, auto: false, paper: 0, roller: 0, cutterY: -config.travel };

        const ui = {
            status: document.getElementById('status-text'),
            step: document.getElementById('step-info'),
            btnAuto: document.getElementById('btn-auto'),
            btnNext: document.getElementById('btn-next'),
            speed: document.getElementById('rng-speed'),
            speedTxt: document.getElementById('speed-txt')
        };

        const svg = {
            roll: document.getElementById('paper-roll-full-group'),
            marker: document.getElementById('roller-marker'),
            receipt: document.getElementById('paper-receipt-printed'),
            cutter: document.getElementById('cutter-blade-moving-group'),
            head: document.getElementById('thermal-head'),
            particles: document.querySelectorAll('.dust-particle')
        };

        function updateUI(msg, step, busy) {
            ui.status.textContent = msg;
            ui.step.textContent = `Step: ${step}/3`;
            state.step = step;
            state.animating = busy;
            ui.btnAuto.disabled = busy || step !== 0;
            ui.btnNext.disabled = busy || step >= 3;
        }

        // --- 動作：1. 進紙 ---
        function actionFeed() {
            updateUI("進紙列印中...", 1, true);
            svg.head.style.fill = "#ff4500";
            
            function frame() {
                const s = parseFloat(ui.speed.value) * 2;
                state.paper += 0.5 * s;
                state.roller += 5 * s;
                svg.marker.setAttribute("transform", `rotate(${state.roller}, 0, -15)`);
                svg.roll.setAttribute("transform", `rotate(${state.roller * 0.3}, 0, 0)`);
                svg.receipt.setAttribute("x2", 25 + state.paper);

                if (state.paper >= config.maxPaper) {
                    svg.head.style.fill = "#555";
                    updateUI("列印完成。等待裁切...", 1, false);
                    if (state.auto) actionCut();
                } else {
                    requestAnimationFrame(frame);
                }
            }
            requestAnimationFrame(frame);
        }

        // --- 動作：2. 裁切與噴濺 ---
        function actionCut() {
            updateUI("執行裁切動作...", 2, true);
            let hasSprayed = false;

            function frame() {
                const s = parseFloat(ui.speed.value) * 3;
                state.cutterY += s;
                svg.cutter.setAttribute("transform", `translate(0, ${state.cutterY})`);

                if (state.cutterY >= 0 && !hasSprayed) {
                    hasSprayed = true;
                    spawnDust(); // 觸發物理紙屑
                }

                if (state.cutterY >= 15) { // 切到底
                    state.cutterY = 15;
                    svg.cutter.setAttribute("transform", `translate(0, 15)`);
                    updateUI("裁切完畢。等待復歸...", 2, false);
                    if (state.auto) setTimeout(actionRetract, 500);
                } else {
                    requestAnimationFrame(frame);
                }
            }
            requestAnimationFrame(frame);
        }

        // --- 動作：3. 復歸 ---
        function actionRetract() {
            updateUI("刀片復歸中...", 3, true);
            function frame() {
                const s = parseFloat(ui.speed.value) * 2;
                state.cutterY -= s;
                svg.cutter.setAttribute("transform", `translate(0, ${state.cutterY})`);
                if (state.cutterY <= -config.travel) {
                    state.cutterY = -config.travel;
                    svg.cutter.setAttribute("transform", `translate(0, ${state.cutterY})`);
                    updateUI("全流程完成", 3, false);
                } else {
                    requestAnimationFrame(frame);
                }
            }
            requestAnimationFrame(frame);
        }

        // --- 物理效果：向左噴濺的紙屑 ---
        function spawnDust() {
            svg.particles.forEach(p => {
                p.style.opacity = 1;
                // 修正2：噴濺方向調整。 vx 現在有較大概率產生向左(負值)的速度
                const vx = (Math.random() - 0.7) * 12; // -8.4 到 +3.6，偏向左側(滾輪方向)
                const vy = -(Math.random() * 8 + 2);
                let px = 0, py = 0, curVy = vy, life = 1.0;

                function anim() {
                    px += vx; py += curVy; curVy += 0.5; life -= 0.02;
                    p.setAttribute('transform', `translate(${px}, ${py}) scale(${life})`);
                    p.style.opacity = life;
                    if (life > 0) requestAnimationFrame(anim);
                }
                requestAnimationFrame(anim);
            });
        }

        // 事件監聽
        ui.btnAuto.onclick = () => { state.auto = true; actionFeed(); };
        ui.btnNext.onclick = () => {
            state.auto = false;
            if (state.step === 0) actionFeed();
            else if (state.step === 1) actionCut();
            else if (state.step === 2) actionRetract();
        };
        document.getElementById('btn-reset').onclick = () => location.reload();
        ui.speed.oninput = (e) => ui.speedTxt.textContent = e.target.value;
        document.getElementById('chk-xray').onclick = (e) => {
            document.getElementById('chassis-outline').classList.toggle('transparent-casing', e.target.checked);
        };
    </script>
</body>
</html>
